[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zebrafish-local"
version = "0.1.0"
description = "Zebrafish local chess application and development workflows"
requires-python = ">=3.11"
dependencies = ["python-chess==1.999"]

[project.optional-dependencies]
browser-tests = ["playwright>=1.40"]

[project.scripts]
zebrafish = "zebrafish.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]
